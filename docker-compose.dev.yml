# Infrastructure only, for local development and tests (apps run on the host with `pnpm dev`).
#   docker compose -f docker-compose.dev.yml up -d --wait
# Ports: postgres 5433 · SeaweedFS S3 8334 · Gotenberg 3002 · plus the backup service (no port)
name: supun-dev

services:
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_USER: supun
      POSTGRES_PASSWORD: supun
      POSTGRES_DB: postgres
      TZ: Asia/Colombo
    ports:
      - '127.0.0.1:5433:5432'
    volumes:
      - pgdata_dev:/var/lib/postgresql
      - ./docker/postgres/init-dev.sql:/docker-entrypoint-initdb.d/10-init-dev.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U supun -d supun_test']
      interval: 5s
      timeout: 5s
      retries: 20

  seaweedfs:
    image: chrislusf/seaweedfs:4.48
    entrypoint: ['/bin/sh', '/sc-entrypoint.sh']
    environment:
      S3_ACCESS_KEY: dev-access-key
      S3_SECRET_KEY: dev-secret-key
    ports:
      - '127.0.0.1:8334:8333'
    volumes:
      - seaweed_dev:/data
      - ./docker/seaweedfs/entrypoint.sh:/sc-entrypoint.sh:ro
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O /dev/null http://127.0.0.1:8333/healthz || exit 1']
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

  gotenberg:
    image: gotenberg/gotenberg:8.37.0-chromium
    ports:
      - '127.0.0.1:3002:3000'
    healthcheck:
      test: ['CMD-SHELL', 'curl -fsS http://127.0.0.1:3000/health || exit 1']
      interval: 10s
      timeout: 5s
      retries: 20

  # The backup service for the dev database (so Settings → Backup shows it running). Google Drive
  # sign-in is not available in dev (port 53682 is left to the full stack).
  backup:
    build:
      context: .
      dockerfile: docker/backup/Dockerfile
    image: supun-backup-dev:latest
    init: true
    environment:
      TZ: Asia/Colombo
      PGHOST: postgres
      PGPORT: 5432
      PGUSER: supun
      PGPASSWORD: supun
      PGDATABASE: supun_dev
      S3_ENDPOINT: http://seaweedfs:8333
      S3_ACCESS_KEY: dev-access-key
      S3_SECRET_KEY: dev-secret-key
      S3_BUCKET: supun-docs
      RESTIC_PASSWORD: dev-backup-password
      API_HEALTH_URL: http://host.docker.internal:4000/health
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    volumes:
      - backup_dev:/backup-local
      - rclone_dev:/config/rclone
    depends_on:
      postgres:
        condition: service_healthy
      seaweedfs:
        condition: service_healthy

volumes:
  pgdata_dev:
  seaweed_dev:
  backup_dev:
  rclone_dev:
